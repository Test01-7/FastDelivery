<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
    <rect width="160" height="160" rx="14" fill="#ffffff"/>
    <!-- Caja Amarilla de Solbitox Niños -->
    <rect x="36" y="42" width="46" height="82" rx="3" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>
    <rect x="40" y="46" width="38" height="12" fill="#ca8a04" rx="2"/>
    <text x="59" y="55" font-size="5" fill="#ffffff" font-weight="900" text-anchor="middle" font-family="sans-serif">SOLBITOX</text>
    <text x="59" y="63" font-size="4" fill="#713f12" font-weight="bold" text-anchor="middle" font-family="sans-serif">NIÑOS</text>
    <rect x="42" y="70" width="34" height="2" fill="#713f12"/>
    <text x="59" y="80" font-size="3" fill="#854d0e" text-anchor="middle" font-family="sans-serif">USO PEDIÁTRICO</text>
    <text x="59" y="88" font-size="3" fill="#854d0e" text-anchor="middle" font-family="sans-serif">120 ml</text>

    <!-- Frasco Ámbar con tapa blanca -->
    <rect x="98" y="66" width="20" height="10" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="103" y="76" width="10" height="5" fill="#b45309"/>
    <!-- Cuerpo frasco color caramelo/ámbar -->
    <rect x="90" y="81" width="36" height="43" rx="5" fill="#78350f" stroke="#451a03" stroke-width="1"/>
    <!-- Etiqueta amarilla en frasco -->
    <rect x="93" y="87" width="30" height="28" rx="2" fill="#fef08a"/>
    <text x="108" y="96" font-size="4" fill="#713f12" font-weight="bold" text-anchor="middle" font-family="sans-serif">SOLBITOX</text>
    <rect x="96" y="99" width="24" height="1.5" fill="#ca8a04"/>
    <text x="108" y="106" font-size="3" fill="#854d0e" text-anchor="middle" font-family="sans-serif">Niños</text>
</svg>
