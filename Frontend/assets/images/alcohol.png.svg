<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
    <!-- Botella de Alcohol Medicinal 70 -->
    <rect width="160" height="160" rx="14" fill="#ffffff"/>
    <!-- Tapa -->
    <rect x="70" y="24" width="20" height="14" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="74" y1="28" x2="74" y2="34" stroke="#94a3b8" stroke-width="1"/>
    <line x1="80" y1="28" x2="80" y2="34" stroke="#94a3b8" stroke-width="1"/>
    <line x1="86" y1="28" x2="86" y2="34" stroke="#94a3b8" stroke-width="1"/>
    <!-- Cuello -->
    <path d="M68 38 L92 38 L96 52 L64 52 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Cuerpo botella blanca -->
    <rect x="55" y="52" width="50" height="78" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Etiqueta Azul y Blanca -->
    <rect x="58" y="65" width="44" height="52" rx="3" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="62" y="68" width="36" height="6" fill="#1e3a8a" rx="1"/>
    <text x="80" y="73" font-size="4.5" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="sans-serif">Alkofarma</text>
    <text x="80" y="85" font-size="7" fill="#1e3a8a" font-weight="900" text-anchor="middle" font-family="sans-serif">Alcohol</text>
    <text x="80" y="93" font-size="5" fill="#3b82f6" font-weight="bold" text-anchor="middle" font-family="sans-serif">Medicinal</text>
    <!-- Badge 70° -->
    <rect x="68" y="97" width="24" height="10" rx="2" fill="#1e3a8a"/>
    <text x="80" y="104.5" font-size="6.5" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="sans-serif">70°</text>
    <text x="80" y="113" font-size="4" fill="#64748b" text-anchor="middle" font-family="sans-serif">120 ml</text>
</svg>
