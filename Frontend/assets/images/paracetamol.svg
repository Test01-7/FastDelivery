<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
    <rect width="160" height="160" rx="14" fill="#ffffff"/>
    <!-- Caja de Paracetamol (Izquierda) -->
    <rect x="30" y="38" width="46" height="85" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Franja roja superior y lateral de la caja -->
    <rect x="30" y="38" width="46" height="10" fill="#dc2626"/>
    <rect x="30" y="48" width="10" height="75" fill="#ef4444"/>
    <text x="54" y="66" font-size="5" fill="#0f172a" font-weight="900" font-family="sans-serif">Paracetamol</text>
    <text x="54" y="74" font-size="3.5" fill="#64748b" font-family="sans-serif">120mg / 5ml</text>
    <text x="54" y="80" font-size="3" fill="#dc2626" font-weight="bold" font-family="sans-serif">Jarabe Pediátrico</text>
    <circle cx="56" cy="100" r="10" stroke="#cbd5e1" stroke-width="1" fill="none"/>
    <text x="56" y="103" font-size="9" fill="#94a3b8" font-family="serif" text-anchor="middle">P</text>

    <!-- Frasco con tapa blanca (Derecha) -->
    <!-- Tapa frasco -->
    <rect x="94" y="58" width="22" height="12" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Cuello -->
    <rect x="98" y="70" width="14" height="6" fill="#f1f5f9"/>
    <!-- Cuerpo frasco blanco -->
    <rect x="85" y="76" width="40" height="47" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="89" y="82" width="32" height="28" rx="2" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="89" y="82" width="32" height="4" fill="#dc2626"/>
    <text x="105" y="93" font-size="4" fill="#0f172a" font-weight="bold" text-anchor="middle" font-family="sans-serif">Paracetamol</text>
    <circle cx="105" cy="101" r="5" stroke="#cbd5e1" stroke-width="0.75" fill="none"/>
    <text x="105" y="103" font-size="5" fill="#94a3b8" text-anchor="middle" font-family="serif">P</text>
</svg>
